# ===========================================
# New Empires - Docker Compose for Dockploy
# Strategy Game - Static Site Deployment
# ===========================================

services:
  newempire-pss-txn-01:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: newempire-pss-txn-01
    restart: unless-stopped

    # Environment variables
    environment:
      - HOST=0.0.0.0
      - NODE_ENV=production

    # Healthcheck
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resources (Optimized for static site)
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Labels for Dockploy/Traefik
    labels:
        - "traefik.enable=true"
        - "traefik.http.routers.newempire-pss-txn-01.rule=Host(`newempire-pss-txn-01.tudexnetworks.com`)"
        - "traefik.http.routers.newempire-pss-txn-01.priority=100"
        - "traefik.http.services.newempire-pss-txn-01.loadbalancer.server.port=80"

    networks:
      - dokploy-network
    

networks:
  dokploy-network:
    external: true
  default:
    name: tudex-network
    driver: bridge