services:
  # Servidor Backend
  backend:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://database:27017/flexyapp1-pss-txn-01
      - CORS_ORIGIN=*
    depends_on:
      - database
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flexyapp1-pss-txn-01.rule=Host(`flexyapp1-pss-txn-01.tudexnetworks.com`)"
      - "traefik.http.routers.flexyapp1-pss-txn-01.entrypoints=web"
      - "traefik.http.routers.flexyapp1-pss-txn-01.priority=100"
      - "traefik.http.services.flexyapp1-pss-txn-01.loadbalancer.server.port=3000"
    networks:
      - app-tier
      - dokploy-network

  # Base de Datos
  database:
    image: mongo:7.0
    restart: unless-stopped
    environment:
      - MONGO_INITDB_DATABASE=flexyapp1-pss-txn-01
    volumes:
      - mongo-persistence:/data/db
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  mongo-persistence:

# ========================================
# VARIABLES DE ENTORNO PARA DOKPLOY
# ========================================
# Copia estas variables en la configuración de Dokploy
# cuando despliegues el proyecto

# Entorno de ejecución
NODE_ENV=production

# Puerto del servidor (Dokploy lo maneja automáticamente)
PORT=3000

# Base de datos MongoDB
# Usar el nombre del servicio definido en docker-compose.yml
MONGODB_URI=mongodb://mongo:27017/flexyapp1-pss-txn-01

# CORS - Origins permitidos
# En producción, reemplazar con tu dominio real
# Ejemplo: CORS_ORIGIN=https://flexyapp1-pss-txn-01.tudexnetworks.com
CORS_ORIGIN=*

# Versión de la aplicación (opcional)
APP_VERSION=1.0.0

# ========================================
# INSTRUCCIONES PARA DOKPLOY:
# ========================================
# 1. Crear una nueva aplicación en Dokploy
# 2. Conectar tu repositorio de GitHub
# 3. En la sección "Environment Variables", agregar las variables de arriba
# 4. Asegurarte de que docker-compose.yml esté configurado
# 5. Deploy! 🚀
