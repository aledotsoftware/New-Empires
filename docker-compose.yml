# ===========================================
# New Empires - Local Docker Compose
# RTS Game - Node.js Static Server
# ===========================================

services:
  game:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: new-empires
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: [ "CMD-SHELL", "wget -q --spider http://localhost:3000/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 3s
