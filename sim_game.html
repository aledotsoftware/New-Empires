<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>New Empires Simulation</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="selectionContent" style="display:none;"></div>
    <div id="commandPanel" style="display:none;"></div>
    <div id="notifications" style="display:none;"></div>
    <div id="buildMenu" style="display:none;"></div>
    <div id="pauseButton" style="display:none;"></div>
    <div id="pauseIcon" style="display:none;"></div>
    <script type="module">
        import { Game } from './js/core/Game.js';

        window.startSim = function() {
            // Mock out particle system and sound manager
            window.game = new Game('romans');

            // Spawn a building and set it to low hp
            const building = game.buildings[0];
            building.hp = 10;
            building.maxHp = 1000;
            building.isUnderConstruction = false;

            // Run update loop a few times to trigger damage effects
            for(let i = 0; i < 60; i++) {
                game.update(0.016);
            }

            // Mark dead and run update to trigger collapse
            building.hp = 0;
            building.isDead = true;

            game.update(0.016);

            game.render();
            console.log("Simulation complete, particle system called:", game.particleSystem ? "yes" : "no");
        };
    </script>
</body>
</html>
