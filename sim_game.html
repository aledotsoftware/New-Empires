<!DOCTYPE html>
<html>
<head>
    <title>Sim Game</title>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <script type="module">
        import { Game } from './js/core/Game.js';
        import { CONFIG } from './js/core/constants.js';

        // Mock dependencies
        window.soundManager = { play: () => {}, playArrow: () => {}, playHit: () => {} };
        window.assetLoader = { getImage: () => null, getSrc: () => null };
        window.civilizationManager = {
            getCivilization: () => ({}),
            getStartingResources: () => ({wood: 0, food: 0, gold: 0, stone: 0}),
            applyUnitBonuses: () => {},
            applyBuildingBonuses: () => {},
            getTeamColor: () => 'red'
        };
        window.dataLoader = { isLoaded: () => true, getUnitsForCivilization: () => [] };

        // Disable FOW for testing
        CONFIG.VISION.ENABLED = false;

        // Initialize Game
        const game = new Game('romans');

        // Pause to prevent continuous rendering
        game.isPaused = true;

        // Clear entities
        game.units = [];
        game.buildings = [];
        game.enemies = [];

        // Add a building
        import { TownCenter } from './js/entities/buildings/TownCenter.js';
        const building = new TownCenter(400, 300, 'player');
        building.hp = 100;
        building.maxHp = 1000; // 10% hp to trigger severe damage
        game.buildings.push(building);

        // Add an archer
        import { Archer } from './js/entities/units/Archer.js';
        const archer = new Archer(200, 300, 'player');
        game.units.push(archer);

        // Force update to create damage effects
        building.update(0.1, game);

        // Force archer to attack building
        archer.attackTarget = building;
        archer.attackCooldown = 0;
        archer.update(0.1, game); // Should trigger createProjectileTrail(flaming)

        // Update particles
        game.particleSystem.update(0.1);
        game.particleSystem.update(0.1);
        game.particleSystem.update(0.1);

        // Render
        game.render();

        // Extract screenshot via canvas
        const dataURL = document.getElementById('gameCanvas').toDataURL('image/png');

        // Send to console
        console.log("DATA_URL:" + dataURL);

    </script>
</body>
</html>
