<!DOCTYPE html>
<html>
<head>
<script type="module">
import { Game } from './js/core/Game.js';
import { Building } from './js/entities/Building.js';
window.Game = Game;
window.Building = Building;
</script>
<script>
window.onload = function() {
    setTimeout(() => {
        try {
            const canvas = document.createElement('canvas');
            canvas.id = 'gameCanvas';
            document.body.appendChild(canvas);
            const uiLayer = document.createElement('div');
            uiLayer.id = 'uiLayer';
            document.body.appendChild(uiLayer);

            window.game = new window.Game();
            game.init();

            // Let's create a building and simulate damage
            const b = new window.Building(100, 100, 'house', 1);
            game.addEntity(b);
            b.hp = 10; // low HP

            // update it
            b.update(1/60);

            console.log("Building update completed without crash. particleSystem particles:", game.particleSystem.particles.length);
            document.title = "SUCCESS";
        } catch(e) {
            console.error(e);
            document.title = "ERROR: " + e.message;
        }
    }, 1000);
};
</script>
</head>
<body></body>
</html>
